name: setup
description: pnpm, Node 24, the tools the security probes need and, unless install is "false", a frozen install
inputs:
  install:
    description: Run pnpm install --frozen-lockfile ("false" leaves the install to the caller)
    default: "true"
  cache:
    description: Restore the pnpm cache ("false" in a job with a write token, where a poisoned cache would run)
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 24.14.x
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    # The integration tests run the grep and find tools against injection probes (ripgrep, fd) and look for
    # leftover processes (pgrep). A missing binary fails them in CI instead of skipping them (ruling R92).
    - name: Install ripgrep, fd and procps
      shell: bash
      run: |
        missing=()
        command -v rg >/dev/null || missing+=(ripgrep)
        command -v fd >/dev/null || command -v fdfind >/dev/null || missing+=(fd-find)
        command -v pgrep >/dev/null || missing+=(procps)
        if [ "${#missing[@]}" -gt 0 ]; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${missing[@]}"
        fi
        command -v fd >/dev/null || sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
    - if: inputs.install == 'true'
      run: pnpm install --frozen-lockfile
      shell: bash
