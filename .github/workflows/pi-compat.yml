name: pi-compat
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  latest-pi-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The setup action brings pnpm, Node and the probe tools (R92); the install waits for the bump.
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - run: node --disable-warning=ExperimentalWarning scripts/pi-compat-bump.ts
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit
      # Worker scopes need a lingering systemd user manager; the scope tests fail in CI without one (owner M2-Q8, R92).
      - run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - run: pnpm test:int
