name: ci
on:
  pull_request:
  push:
    branches: [main, feat/agents-vm-1]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      # The root tsc resolves @pap/contracts through its dist.
      - run: pnpm --filter @pap/contracts build
      - run: pnpm typecheck
      - run: pnpm knip
  unit:
    name: unit (${{ matrix.shard }}/2)
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:unit --shard=${{ matrix.shard }}/2
  integration:
    name: integration (${{ matrix.shard }}/4)
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          sandbox: "true"
      # Worker scopes need a lingering systemd user manager; the scope tests fail in CI without one (owner M2-Q8, R92).
      - run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - run: scripts/ci/without-inherited-fds.sh pnpm test:int --shard=${{ matrix.shard }}/4
  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # The built daemon forking the built worker, no --conditions: scripted provider, temp dirs, network guard.
      - run: pnpm smoke
      # The unit `pap service install` writes: its ExecStart= line boots the built daemon (fake systemctl, temp HOME).
      - run: pnpm smoke:install
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            apps/*/dist
            packages/*/dist
          retention-days: 3
  budgets:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # test:budget runs vitest on the search corpus (65 s to build, about 2.5 minutes for the step): frozen install.
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: .
      - run: pnpm budgets
      - run: pnpm test:budget
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          sandbox: "true"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: .
      # The browsers installed here are the local ones the runner picks up (docs/agents/e2e.md).
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            scripts/e2e/playwright-report
            scripts/e2e/test-results
          retention-days: 7
  # AVM-P18: the agents' VMs for real (Kata Containers, KVM). ubuntu-24.04 runners expose /dev/kvm (T0a); without it the job
  # fails, it never skips. The only network use is what `pap vm setup` fetches (pinned archives) and the pinned base image.
  kata:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          sandbox: "true"
      - name: Check KVM
        run: |
          test -c /dev/kvm || { echo "::error::this runner has no /dev/kvm: the kata job cannot run"; exit 1; }
          ls -l /dev/kvm
      # `vm setup --dev-from-tree` installs pap-vmd and the agent bundle from this checkout (packages/pi-host/dist-agent is not in the dist artifact).
      - run: pnpm build
      - run: scripts/ci/kata-setup.sh
      # T16a: the bridge guard against forged ARP and spoofed sources, in throwaway network namespaces (a private /run).
      - run: sudo unshare --net --mount sh -c 'mount -t tmpfs tmpfs /run && sh scripts/ci/netns-spoof.sh'
      - run: CI=1 pnpm vitest run --project kata
      - name: Journal of the VM stack
        if: failure()
        run: sudo journalctl -u 'pap-vm*' --no-pager > "$RUNNER_TEMP/pap-vm-journal.txt" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: pap-vm-journal
          path: ${{ runner.temp }}/pap-vm-journal.txt
          retention-days: 7
